    <style id="omniflow-responsive-overrides">
      @media (max-width: 767px) {
        *, ::before, ::after {
          box-sizing: border-box !important;
        }
        html, body {
          overflow-x: hidden !important;
          max-width: 100vw !important;
          width: 100% !important;
        }
        .grid, .grid-cols-1, [class*="grid-cols-"], [class*="md:grid-cols-"], [class*="lg:grid-cols-"], [style*="grid-template-columns"] {
          display: grid !important;
          grid-template-columns: minmax(0, 1fr) !important;
          width: 100% !important;
          max-width: 100% !important;
        }
        .grid > *, [class*="grid-cols-"] > *, [class*="md:grid-cols-"] > *, [class*="lg:grid-cols-"] > *,
        omniflow-container, omniflow-slider, omniflow-marquee, omniflow-card, omniflow-hero-banner, omniflow-datagrid,
        section, article {
          grid-column: 1 / -1 !important;
          min-width: 0 !important;
          max-width: 100% !important;
          width: 100% !important;
          box-sizing: border-box !important;
        }
        .slider-track {
          max-width: 100% !important;
          min-width: 0 !important;
          width: 100% !important;
          overflow-x: auto !important;
        }
        .slider-track > * {
          min-width: 0 !important;
        }
        h1, h2, h3, h4, p, span, a {
          overflow-wrap: break-word !important;
          word-break: break-word !important;
        }

      @media (min-width: 768px) and (max-width: 1023px) {
        .md\:grid-cols-2, .md\:grid-cols-3, [class*="lg:grid-cols-3"] {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;

        .md\:grid-cols-3 > *, [class*="lg:grid-cols-3"] > * {
          max-width: 100% !important;
          min-width: 0 !important;
        }

/* ==========================================================================
   OmniFlow Design System — Dynamic Design Tokens
   Generado automáticamente por el Theme Manager de OmniFlow

:root {
  /* Colores Semánticos (Modo Claro por Defecto) */
  --color-primary: #3b82f6;
  --color-secondary: #64748b;
  --color-bg: #ffffff;
  --color-text: #0f172a;
  --color-surface: #ffffff;
  --color-border: #e2e8f0;

  /* Tipografía Centralizada */
  --font-heading: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-base-size: 16px;

  /* Geometría y Radio de Bordes */
  --radius-base: 0.75rem;
  --radius-token: 0.75rem;
}

.dark, [data-theme="dark"] {
  /* Colores Semánticos Alternos (Modo Oscuro) */
  --color-bg: #030712;
  --color-text: #f8fafc;
  --color-surface: #0d1527;
  --color-border: #1e293b;
}

/* Clases Utilitarias Semánticas de OmniFlow (Consumen CSS Variables dinámicas) */
.bg-primary { background-color: var(--color-primary) !important; }
.text-primary { color: var(--color-primary) !important; }
.border-primary { border-color: var(--color-primary) !important; }

.bg-secondary { background-color: var(--color-secondary) !important; }
.text-secondary { color: var(--color-secondary) !important; }
.border-secondary { border-color: var(--color-secondary) !important; }

.bg-canvas { background-color: var(--color-bg) !important; }
.bg-surface { background-color: var(--color-surface) !important; }
.text-body { color: var(--color-text) !important; }
.border-border { border-color: var(--color-border) !important; }

.omniflow-glassmorphism, .bg-glassmorphism {
  background-color: rgba(15, 23, 42, 0.72) !important;
  backdrop-filter: blur(16px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
}
.omniflow-glassmorphism-light {
  background-color: rgba(255, 255, 255, 0.78) !important;
  backdrop-filter: blur(16px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
  border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
}
@supports (background-color: color-mix(in srgb, red 50%, blue)) {
  .omniflow-glassmorphism, .bg-glassmorphism {
    background-color: color-mix(in srgb, var(--color-surface, #0f172a) 70%, transparent) !important;
  }
  .omniflow-glassmorphism-light {
    background-color: color-mix(in srgb, var(--color-surface, #ffffff) 78%, transparent) !important;
  }
}

.font-heading { font-family: var(--font-heading) !important; }
.font-body { font-family: var(--font-body) !important; }

.rounded-token { border-radius: var(--radius-base) !important; }
.rounded-base { border-radius: var(--radius-base) !important; }
